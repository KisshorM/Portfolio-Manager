<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Performance | StockView Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg: #0c0e12; --surface: #151922; --surface-elevated: #1c2129;
            --border: #2a3142; --text: #e8eaef; --text-muted: #8b92a3;
            --accent: #22d3ee; --green: #34d399; --red: #f87171; --neutral: #94a3b8;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        .container { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 28px 16px; position: sticky; top: 0; height: 100vh; }
        .sidebar-brand { font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 32px; display: flex; align-items: center; gap: 10px; }
        .sidebar a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; color: var(--text-muted); text-decoration: none; border-radius: 12px; transition: 0.2s; margin-bottom: 4px; }
        .sidebar a:hover { background: var(--surface-elevated); color: var(--text); }
        .sidebar a.active { background: rgba(34, 211, 238, 0.12); color: var(--accent); }

        .main { flex: 1; padding: 40px; max-width: 1400px; margin: 0 auto; width: 100%; }
        
        /* Tab Navigation */
        .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .tab { padding: 12px 24px; cursor: pointer; color: var(--text-muted); font-weight: 600; border-bottom: 2px solid transparent; transition: 0.2s; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* Metrics */
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .metric-card { background: var(--surface); padding: 22px; border-radius: 18px; border: 1px solid var(--border); }
        .metric-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .metric-value { font-size: 24px; font-weight: 700; margin-top: 8px; }

        /* Table Area */
        .card { background: var(--surface); padding: 24px; border-radius: 20px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--text-muted); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 16px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
        
        .symbol-tag { font-weight: 700; color: var(--accent); background: rgba(34, 211, 238, 0.1); padding: 4px 8px; border-radius: 6px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-bullish { background: rgba(52, 211, 153, 0.15); color: var(--green); }
        .badge-bearish { background: rgba(248, 113, 113, 0.15); color: var(--red); }
        
        /* Buttons */
        .btn-report { background: var(--accent); color: var(--bg); border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .action-btn { border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; color: var(--bg); transition: 0.2s; }
        .btn-plus { background: var(--green); margin-right: 4px; }
        .btn-minus { background: var(--red); }
        .btn-remove { background: #334155; color: white; margin-left: 8px; }
        .btn-remove:hover { background: var(--red); }

        .up { color: var(--green); } .down { color: var(--red); }
        .hidden { display: none !important; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; }
        .modal { background: var(--surface); padding: 30px; border-radius: 24px; width: 400px; border: 1px solid var(--border); }
        .modal input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; margin-top: 10px; margin-bottom: 20px; outline: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="sidebar-brand"><i class="fa fa-chart-line"></i> StockView</div>
        <a th:href="@{/}"><i class="fa fa-wallet"></i> Dashboard</a>
        <a th:href="@{/performance}" class="active"><i class="fa fa-chart-bar"></i> Performance</a>
        <a th:href="@{/market}"><i class="fa fa-search"></i> Market Lookup</a>
    </div>

    <div class="main">
        <div class="tabs">
            <div class="tab active" onclick="toggleView('holdings')">Holdings Analysis</div>
            <div class="tab" onclick="toggleView('watchlist')">Watchlist Sentiment</div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Total Realized P/L</div>
                <div id="summary-total-pl" class="metric-value">$0.00</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Market Trend</div>
                <div id="summary-trend" class="metric-value" style="color: var(--green);">Bullish</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Live Data</div>
                <div class="metric-value">Connected</div>
            </div>
            <div class="metric-card" style="display: flex; align-items: center;">
                <button class="btn-report" style="width: 100%;" onclick="generatePDF()">Export Statement</button>
            </div>
        </div>

        <div class="card">
            <table id="stocks-table">
                <thead>
                    <tr>
                        <th>Asset</th>
                        <th>Sentiment</th>
                        <th>Live Price</th>
                        <th class="holdings-only">Market Value</th>
                        <th class="holdings-only">Total Gain/Loss</th>
                        <th style="text-align: right;">Quick Trade / Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<div id="tradeModal" class="modal-overlay" onclick="if(event.target==this) closeModal()">
    <div class="modal">
        <h2 id="modalTitle" style="margin:0">Trade Stock</h2>
        <p id="modalInfo" style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;"></p>
        <label style="font-size: 11px; font-weight: 700;">QUANTITY</label>
        <input type="number" id="tradeQty" value="1" min="1">
        <div style="display: flex; gap: 12px;">
            <button class="btn-report" style="background: var(--surface-elevated); color: white; flex: 1;" onclick="closeModal()">Cancel</button>
            <button class="btn-report" style="flex: 2;" onclick="confirmTrade()">Confirm</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const FINNHUB_KEY = 'd5tpdehr01qtjet0qh10d5tpdehr01qtjet0qh1g';
    let currentView = 'holdings';
    let socket;
    let activeSymbol = '';
    let activeAction = '';

    // MOCK DATA (In real Spring Boot, this would come from Thymeleaf ${performanceHoldings})
    const myHoldings = [
        { symbol: 'AAPL', name: 'Apple Inc.', qty: 10, cost: 1500.00 },
        { symbol: 'TSLA', name: 'Tesla, Inc.', qty: 5, cost: 800.00 }
    ];

    const myWatchlist = [
        { symbol: 'NVDA', name: 'Nvidia Corp.', qty: 0, cost: 0 },
        { symbol: 'BTC-USD', name: 'Bitcoin', qty: 0, cost: 0 }
    ];

    function toggleView(view) {
        currentView = view;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        renderTable();
    }

    async function renderTable() {
        const body = document.getElementById('table-body');
        const data = currentView === 'holdings' ? myHoldings : myWatchlist;
        body.innerHTML = '';

        // UI Header adjustments
        const holdingCols = document.querySelectorAll('.holdings-only');
        holdingCols.forEach(col => col.style.display = (currentView === 'holdings' ? 'table-cell' : 'none'));

        data.forEach(item => {
            const row = document.createElement('tr');
            row.id = `row-${item.symbol}`;
            row.innerHTML = `
                <td>
                    <span class="symbol-tag">${item.symbol}</span>
                    <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">${item.name}</div>
                </td>
                <td><span id="sent-${item.symbol}" class="badge">Analysing...</span></td>
                <td id="price-${item.symbol}" style="font-weight: 700;">$0.00</td>
                <td class="holdings-only" id="mkt-${item.symbol}">$0.00</td>
                <td class="holdings-only" id="pl-${item.symbol}">$0.00</td>
                <td style="text-align: right;">
                    <button class="action-btn btn-plus" onclick="openTrade('${item.symbol}', 'buy')"><i class="fa fa-plus"></i></button>
                    ${currentView === 'holdings' ? 
                        `<button class="action-btn btn-minus" onclick="openTrade('${item.symbol}', 'sell')"><i class="fa fa-minus"></i></button>` : 
                        `<button class="action-btn btn-remove" onclick="removeStock('${item.symbol}')"><i class="fa fa-trash"></i></button>`
                    }
                </td>
            `;
            body.appendChild(row);
            fetchInitialData(item.symbol, item.qty, item.cost);
        });
        
        setupWebSocket(data.map(d => d.symbol));
    }

    async function fetchInitialData(sym, qty, cost) {
        // Price
        const qRes = await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${FINNHUB_KEY}`);
        const qData = await qRes.json();
        updateRowNumbers(sym, qData.c, qty, cost);

        // Sentiment
        const sRes = await fetch(`https://finnhub.io/api/v1/news-sentiment?symbol=${sym}&token=${FINNHUB_KEY}`);
        const sData = await sRes.json();
        const badge = document.getElementById(`sent-${sym}`);
        if(sData.sentiment) {
            const isBull = sData.sentiment.bullishPercent > 0.5;
            badge.innerText = isBull ? 'Bullish' : 'Bearish';
            badge.className = `badge ${isBull ? 'badge-bullish' : 'badge-bearish'}`;
        }
    }

    function updateRowNumbers(sym, price, qty, cost) {
        if(!price) return;
        document.getElementById(`price-${sym}`).innerText = `$${price.toFixed(2)}`;
        
        if(currentView === 'holdings') {
            const mktVal = price * qty;
            const pl = mktVal - cost;
            document.getElementById(`mkt-${sym}`).innerText = `$${mktVal.toFixed(2)}`;
            const plEl = document.getElementById(`pl-${sym}`);
            plEl.innerText = `${pl >= 0 ? '+' : ''}$${pl.toFixed(2)}`;
            plEl.className = `holdings-only ${pl >= 0 ? 'up' : 'down'}`;
        }
    }

    function setupWebSocket(symbols) {
        if(socket) socket.close();
        socket = new WebSocket(`wss://ws.finnhub.io?token=${FINNHUB_KEY}`);
        socket.onopen = () => symbols.forEach(s => socket.send(JSON.stringify({type:'subscribe', symbol: s})));
        socket.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if(msg.type === 'trade') {
                msg.data.forEach(t => {
                    const item = (currentView === 'holdings' ? myHoldings : myWatchlist).find(x => x.symbol === t.s);
                    if(item) updateRowNumbers(t.s, t.p, item.qty, item.cost);
                });
            }
        };
    }

    function removeStock(sym) {
        const index = myWatchlist.findIndex(x => x.symbol === sym);
        if(index > -1) {
            myWatchlist.splice(index, 1);
            renderTable();
            // In real app: fetch(`/api/watchlist/remove/${sym}`, { method: 'DELETE' });
        }
    }

    function openTrade(sym, action) {
        activeSymbol = sym;
        activeAction = action;
        document.getElementById('modalTitle').innerText = action === 'buy' ? 'Buy Asset' : 'Sell Asset';
        document.getElementById('modalInfo').innerText = `Symbol: ${sym}`;
        document.getElementById('tradeModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('tradeModal').style.display = 'none'; }

    function confirmTrade() {
        const qty = document.getElementById('tradeQty').value;
        alert(`Order confirmed: ${activeAction.toUpperCase()} ${qty} shares of ${activeSymbol}. Redirecting to dashboard...`);
        window.location.href = '/'; // Goes back to Dashboard
    }

    window.onload = renderTable;
</script>
</body>
</html>
