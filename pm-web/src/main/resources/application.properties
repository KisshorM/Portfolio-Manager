# Application
spring.application.name=pm-web

# Datasource (MySQL) - HikariCP pool
spring.datasource.url=jdbc:mysql://localhost:3306/stocks_db?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# Python API (reduce latency: short timeouts, base URL for connection reuse)
python.api.base-url=http://localhost:8000
python.api.connect-timeout-ms=3000
python.api.read-timeout-ms=10000

# Cache TTL (seconds) for Python responses
cache.price.ttl=90
cache.quote-change.ttl=120
cache.stock-data.ttl=300
cache.news.ttl=180
cache.portfolio-history.ttl=120
